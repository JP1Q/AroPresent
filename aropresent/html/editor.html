<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__TITLE__ - Editor</title>
  <link rel="stylesheet" href="/static/editor.css" />
</head>
<body>
  <header>
    <div class="brand">AroPresent Editor</div>
    <div class="controls">
      <select id="template">
        <option value="">Add Slide...</option>
      </select>
      <select id="transitionSelect">
        <option value="none">Slide: None</option>
        <option value="fade">Slide: Fade</option>
        <option value="popup">Slide: Popup</option>
        <option value="slide-right">Slide: Slide Right</option>
      </select>
      <select id="textAnimSelect">
        <option value="none">Text: None</option>
        <option value="anim-fade">Text: Fade</option>
        <option value="anim-pop">Text: Popup</option>
        <option value="anim-right">Text: Slide Right</option>
      </select>
      <button id="deleteBtn">Delete Slide</button>
      <label for="loadPmd" class="file-label">Load .pmd</label>
      <input type="file" id="loadPmd" accept=".pmd" />
      <button id="savePmd">Save .pmd</button>
      <button id="prev">Prev</button>
      <button id="next">Next</button>
      <button id="presentBtn">Present</button>
    </div>
  </header>
  <main>
    <aside>
      <div class="sidebar-title">Slides</div>
      <div id="slides"></div>
    </aside>
    <div class="editor-col">
      <div class="col-header">
        <span>Markdown Source</span>
        <span id="counter"></span>
      </div>
      <textarea id="source" spellcheck="false"></textarea>
    </div>
    <div class="preview-col">
      <div class="col-header">Live Format Preview</div>
      <div class="preview-wrapper">
        <div class="preview-screen">
          <div id="slide" class="slide-view" style="overflow: hidden"></div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const source = document.getElementById('source');
    const slide = document.getElementById('slide');
    const counter = document.getElementById('counter');
    const slideList = document.getElementById('slides');
    const templateSelect = document.getElementById('template');
    const transitionSelect = document.getElementById('transitionSelect');
    const textAnimSelect = document.getElementById('textAnimSelect');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const deleteBtn = document.getElementById('deleteBtn');
    const savePmdBtn = document.getElementById('savePmd');
    const loadPmdInput = document.getElementById('loadPmd');
    const presentBtn = document.getElementById('presentBtn');

    let slides = [];
    let animations = [];
    let rendered = [];
    let index = 0;
    let textStep = 0;
    let renderTimer = null;

    let templates = {};

    function parseConfigs(animStr) {
      const parts = animStr.split(' ');
      return {
        slide: parts[0] || 'none',
        text: parts[1] || 'none'
      };
    }

    function buildPmd() {
      return slides.map((s, i) => {
        const anim = animations[i] || 'none none';
        const prefix = anim === 'none none' ? '' : anim + '\n';
        return "{\n" + prefix + s + "\n}";
      }).join('\n');
    }

    function renderSlides() {
      if (slides.length === 0) {
        rendered = [];
        slide.innerHTML = "";
        slideList.innerHTML = "";
        counter.textContent = "0 / 0";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }
      fetch('/render', { method: 'POST', body: buildPmd() })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            rendered = [];
            slide.textContent = data.error;
            counter.textContent = '';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
          }
          rendered = data.slides || [];
          saveToLocal();
          showSlide();
          refreshList();
        });
    }

    function showSlide() {
      if (rendered[index]) {
        slide.innerHTML = rendered[index].html;
        const animConfigs = parseConfigs(animations[index] || 'none none');
        slide.className = "slide-view " + animConfigs.slide + " " + animConfigs.text;
        slide.style = "overflow: hidden;"

        const items = slide.querySelectorAll('li, p, pre, h1, h2, h3, img');
        items.forEach((el) => el.classList.add('animate-item'));

        if (animConfigs.text === 'none') {
          items.forEach(el => el.classList.add('animated-visible'));
          textStep = items.length;
        } else {
          textStep = 0;
          updateTextAnimations();
        }
      } else {
        slide.innerHTML = "";
        slide.className = "slide-view none none no-over";
        slide.style = "background: red"
        textStep = 0;
      }
      counter.textContent = slides.length ? (index + 1) + " / " + slides.length : "0 / 0";
      prevBtn.disabled = index <= 0 && textStep <= 0;
      nextBtn.disabled = index >= slides.length - 1 && (rendered[index] ? textStep >= slide.querySelectorAll('.animate-item').length : true);

      const currentConfigs = parseConfigs(animations[index] || 'none none');
      transitionSelect.value = currentConfigs.slide;
      textAnimSelect.value = currentConfigs.text;
    }

    function updateTextAnimations() {
      const items = slide.querySelectorAll('.animate-item');
      items.forEach((el, i) => {
        if (i < textStep) {
          el.classList.add('animated-visible');
        } else {
          el.classList.remove('animated-visible');
        }
      });
    }

    function refreshList() {
      slideList.innerHTML = '';
      slides.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'slide-thumb' + (i === index ? ' active' : '');
        div.textContent = "Slide " + (i + 1);
        div.addEventListener('click', () => {
          index = i;
          source.value = slides[index] || '';
          showSlide();
          refreshList();
        });
        slideList.appendChild(div);
      });
    }

    function saveToLocal() {
      localStorage.setItem('aropresent_slides', JSON.stringify(slides));
      localStorage.setItem('aropresent_anims', JSON.stringify(animations));
    }

    source.addEventListener('input', () => {
      if (slides.length === 0) {
        slides.push('');
        animations.push('none none');
        index = 0;
      }
      slides[index] = source.value;
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderSlides, 300);
    });

    transitionSelect.addEventListener('change', () => {
      if (slides.length === 0) return;
      const currentConfigs = parseConfigs(animations[index] || 'none none');
      animations[index] = transitionSelect.value + " " + currentConfigs.text;
      renderSlides();
    });

    textAnimSelect.addEventListener('change', () => {
      if (slides.length === 0) return;
      const currentConfigs = parseConfigs(animations[index] || 'none none');
      animations[index] = currentConfigs.slide + " " + textAnimSelect.value;
      renderSlides();
    });

    templateSelect.addEventListener('change', () => {
      const val = templateSelect.value;
      if (!val) return;
      const content = templates[val] || '';
      slides.push(content);
      animations.push('none none');
      index = slides.length - 1;
      source.value = content;
      templateSelect.value = '';
      renderSlides();
    });

    deleteBtn.addEventListener('click', () => {
      if (slides.length === 0) return;
      slides.splice(index, 1);
      animations.splice(index, 1);
      if (index >= slides.length) {
        index = Math.max(0, slides.length - 1);
      }
      source.value = slides[index] || '';
      renderSlides();
    });

    savePmdBtn.addEventListener('click', () => {
      const data = buildPmd();
      const blob = new Blob([data], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (title.endsWith('.pmd') ? title : title + '.pmd');
      a.click();
    });

    loadPmdInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        fetch('/parse_raw', { method: 'POST', body: evt.target.result })
          .then(res => res.json())
          .then(data => {
            if (data.error) {
              alert(data.error);
              return;
            }
            slides = [];
            animations = [];
            (data.slides || []).forEach(s => {
              slides.push(s.content || '');
              animations.push(s.animation || 'none none');
            });
            index = 0;
            source.value = slides[index] || '';
            renderSlides();
          });
      };
      reader.readAsText(file);
    });

    prevBtn.addEventListener('click', () => {
      const items = slide.querySelectorAll('.animate-item');
      const currentConfigs = parseConfigs(animations[index] || 'none none');
      if (currentConfigs.text !== 'none' && textStep > 0) {
        textStep--;
        updateTextAnimations();
        prevBtn.disabled = index <= 0 && textStep <= 0;
        nextBtn.disabled = index >= slides.length - 1 && textStep >= items.length;
      } else if (index > 0) {
        index--;
        source.value = slides[index] || '';
        showSlide();
        const prevItems = slide.querySelectorAll('.animate-item');
        const prevConfigs = parseConfigs(animations[index] || 'none none');
        if (prevConfigs.text !== 'none') {
          textStep = prevItems.length;
          updateTextAnimations();
        }
        refreshList();
      }
    });

    nextBtn.addEventListener('click', () => {
      const items = slide.querySelectorAll('.animate-item');
      const currentConfigs = parseConfigs(animations[index] || 'none none');
      if (currentConfigs.text !== 'none' && textStep < items.length) {
        textStep++;
        updateTextAnimations();
        prevBtn.disabled = index <= 0 && textStep <= 0;
        nextBtn.disabled = index >= slides.length - 1 && textStep >= items.length;
      } else if (index < slides.length - 1) {
        index++;
        source.value = slides[index] || '';
        showSlide();
        refreshList();
      }
    });

    presentBtn.addEventListener('click', () => {
      window.open('/present', '_blank');
    });

    function loadFromLocal() {
      const saved = localStorage.getItem('aropresent_slides');
      const savedAnims = localStorage.getItem('aropresent_anims');
      if (saved && savedAnims) {
        slides = JSON.parse(saved);
        animations = JSON.parse(savedAnims);
      } else {
        const first = templateSelect.options[1];
        slides = [first ? templates[first.value] : ''];
        animations = ['none none'];
      }
      index = 0;
      source.value = slides[index] || '';
      renderSlides();
    }

    function loadTemplates() {
      return fetch('/slide_templates')
        .then(res => res.json())
        .then(data => {
          (data.templates || []).forEach(t => {
            templates[t.id] = t.content;
            templateSelect.add(new Option(t.label, t.id));
          });
        })
        .catch(() => {});
    }

    loadTemplates().then(loadFromLocal);
  </script>
</body>
</html>
