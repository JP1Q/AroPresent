# Move to .github/workflows/desktop-build.yml (the Claude app cannot write to that directory).
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt
      - run: pyinstaller AroPresent.spec --noconfirm
      - name: Zip .app (keeps permissions)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent AroPresent.app AroPresent-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: AroPresent-macOS
          path: dist/AroPresent-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: AroPresent-Windows
          path: dist/AroPresent.exe
